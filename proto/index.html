<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Greystone Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf7ee;--ink:#3b3530;--tape:rgba(240,180,190,.85);--green:#4f8a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2c2f36;font-family:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;color:var(--ink)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui *{pointer-events:auto}
.bubble{position:absolute;max-width:min(420px,70vw);background:var(--paper);border:2px solid #b9b1a3;border-radius:18px;padding:12px 16px;font-size:22px;line-height:1.25;box-shadow:3px 4px 0 rgba(0,0,0,.18);transform:translate(-50%,-100%);display:none}
.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:12px solid transparent;border-top-color:var(--paper);border-bottom:0}
.bubble .btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;font-size:22px;border:2px solid #8d8577;background:#fff;border-radius:12px;padding:6px 14px;color:var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.15)}
button.go{background:#e6f2dd;border-color:var(--green)}
button:active{transform:translate(1px,2px);box-shadow:none}
#chips{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:8px 14px;min-height:54px;background:rgba(251,247,238,.92);border-radius:6px;box-shadow:2px 3px 0 rgba(0,0,0,.2)}
#chips:before,#chips:after{content:"";position:absolute;top:-10px;width:70px;height:22px;background:var(--tape);transform:rotate(-4deg)}
#chips:before{left:-20px}#chips:after{right:-20px;transform:rotate(5deg);background:rgba(170,215,200,.85)}
#chips .lbl{font-size:18px;opacity:.6}
.chip{font-size:24px;padding:2px 12px;border-radius:4px;background:#fff;border:1px dashed #a39a8b;transform:rotate(-2deg)}
.chip:nth-child(odd){transform:rotate(2deg)}
.chip.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#top{position:absolute;top:12px;right:12px;display:flex;gap:8px}
#top button{font-size:20px;padding:4px 10px;background:rgba(255,255,255,.85)}
#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(251,247,238,.9);padding:6px 16px;border-radius:6px;font-size:22px;box-shadow:2px 3px 0 rgba(0,0,0,.2);transition:opacity .6s}
.ring{position:absolute;width:90px;height:40px;margin:-20px 0 0 -45px;border:4px solid rgba(255,240,150,.95);border-radius:50%;animation:pulse 1.4s infinite;display:none;pointer-events:none!important}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,30,35,.45)}
#panel .card{position:relative;background:var(--paper);width:min(560px,92vw);padding:26px 24px 20px;border-radius:4px;box-shadow:4px 6px 0 rgba(0,0,0,.25);transform:rotate(-1deg);text-align:center;font-size:24px}
#panel .card:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-55px;width:110px;height:26px;background:var(--tape);transform:rotate(3deg)}
#panel h2{margin:0 0 8px;font-weight:normal;font-size:30px}
#panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#preview{max-width:100%;max-height:42vh;display:block;margin:8px auto;background:repeating-conic-gradient(#e9e3d6 0 25%,#f5f1e7 0 50%) 0 0/24px 24px;border-radius:4px}
input[type=text]{font-family:inherit;font-size:28px;padding:6px 12px;width:220px;border:2px solid #8d8577;border-radius:10px;text-align:center;color:#1f5e2a;-webkit-user-select:text;user-select:text}
#mic.on{background:#ffd9d9;border-color:#c55}
.small{font-size:18px;opacity:.7}
label.btn{display:inline-block;font-size:22px;border:2px solid var(--green);background:#e6f2dd;border-radius:12px;padding:6px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.15)}
#scanfile{display:none}
#confetti{position:absolute;inset:0;pointer-events:none!important;overflow:hidden}
.bit{position:absolute;width:14px;height:10px;top:-20px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#9aa0a6;color:#fff;font-size:30px;z-index:9}
#load button{margin-top:20px;font-size:30px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hint">Tap the ground to walk.</div>
  <div id="top"><button id="musicBtn" title="Musik">♪ on</button></div>
  <div class="bubble" id="bubble"><div id="btext"></div><div class="btns" id="bbtns"></div></div>
  <div class="ring" id="ring"></div>
  <div id="chips"><span class="lbl">my words:</span></div>
  <div id="panel"><div class="card" id="card"></div></div>
  <div id="confetti"></div>
</div>
<input type="file" id="scanfile" accept="image/*" capture="environment">
<div id="load"><div>Greystone</div><button id="startBtn" style="display:none">▶ Start</button><div class="small" id="loadmsg">loading …</div></div>

<script type="module">
import * as THREE from './js/three.module.min.js';

/* ---------- world constants (background pixels, y down) ---------- */
const WW = 1920, WH = 1072, HORIZON = 614, K = 0.83;   // person height = K*(y-HORIZON)
const EMMI_H = 0.83;                                   // relative to K
const $ = id => document.getElementById(id);

/* walkable area: band of the square between y 775 and 1040 */
function xRange(y){ const t=(y-775)/(1040-775); return [420+(60-420)*t, 1650+(1860-1650)*t]; }
function clampWalk(x,y){ y=Math.max(775,Math.min(1040,y)); const [a,b]=xRange(y); return [Math.max(a,Math.min(b,x)),y]; }
const depth = y => Math.max(0.05,K*(y-HORIZON)/1);   // pixel height of a 1-unit object

/* ---------- renderer + camera ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(0,WW,WH,0,-1000,1000);
let viewW=WW, viewH=WH, camX=0, camY=0;
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h; renderer.setSize(w,h,false);
  if(a < WW/WH){ viewH=WH; viewW=WH*a; } else { viewW=WW; viewH=WW/a; }
  camY = 0;   // bottom aligned (cut sky if too wide)
  placeCam();
}
function placeCam(){ cam.left=camX; cam.right=camX+viewW; cam.bottom=camY; cam.top=camY+viewH; cam.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* ---------- paper shader ---------- */
const VS=`uniform float uTime,uAmp,uPhase;varying vec2 vUv;varying float vShade;
void main(){vUv=uv;vec3 p=position;
 float e=smoothstep(0.2,0.8,length(uv-vec2(0.5))*1.41);
 float anchor=smoothstep(0.0,0.4,uv.y);
 float w=sin(uTime*2.4+uPhase+uv.y*3.0+uv.x*2.0)+0.5*sin(uTime*3.9+uPhase*1.7+uv.x*5.0);
 float k=uAmp*e*anchor;
 p.x+=w*k*0.018;
 p.y+=cos(uTime*3.1+uPhase+uv.x*4.0)*k*0.010;
 vShade=1.0-0.09*w*k;
 gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`;
const FS=`uniform sampler2D map;uniform float uShadow,uOpacity,uFlip,uTint;varying vec2 vUv;varying float vShade;
void main(){vec2 uv=vUv;if(uFlip>0.5)uv.x=1.0-uv.x;vec4 c=texture2D(map,uv);if(c.a<0.02)discard;
 if(uShadow>0.5)gl_FragColor=vec4(0.10,0.09,0.13,c.a*0.30*uOpacity);
 else{vec3 col=c.rgb*vShade;col=mix(col,vec3(dot(col,vec3(.3,.59,.11))),uTint);gl_FragColor=vec4(col,c.a*uOpacity);}}`;
const clock={t:0};
function paperMat(tex,shadow){
  return new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,transparent:true,depthTest:false,depthWrite:false,
    uniforms:{map:{value:tex},uTime:{value:0},uAmp:{value:1},uPhase:{value:Math.random()*6},uShadow:{value:shadow?1:0},uOpacity:{value:1},uFlip:{value:0},uTint:{value:0}}});
}
const allPapers=[];
class Paper{
  /* tex: texture; aspect w/h; unitH: height relative to person height */
  constructor(tex,aspect,unitH,{amp=1,shadow=true,ground=true}={}){
    this.aspect=aspect; this.unitH=unitH; this.g=new THREE.Group(); scene.add(this.g);
    const geo=new THREE.PlaneGeometry(aspect,1,14,20); geo.translate(0,0.5,0);
    this.mat=paperMat(tex,false); this.mesh=new THREE.Mesh(geo,this.mat);
    if(shadow){ this.smat=paperMat(tex,true); this.smat.uniforms.uPhase=this.mat.uniforms.uPhase; this.sh=new THREE.Mesh(geo,this.smat); this.sh.position.set(0.035,-0.02,0); this.g.add(this.sh); }
    if(ground){ const gm=new THREE.MeshBasicMaterial({color:0x1a1820,transparent:true,opacity:.22,depthTest:false,depthWrite:false});
      this.gs=new THREE.Mesh(new THREE.CircleGeometry(0.5,28),gm); this.gs.scale.set(aspect*0.9,0.12,1); this.g.add(this.gs); }
    this.g.add(this.mesh); this.amp=amp; this.mat.uniforms.uAmp.value=amp; if(this.smat) this.smat.uniforms.uAmp.value=amp;
    this.x=0;this.y=900;this.lift=0;this.rot=0;this.scaleMul=1;this.flip=false;this.visible=true;
    allPapers.push(this);
  }
  setFlip(f){ this.flip=f; this.mat.uniforms.uFlip.value=f?1:0; if(this.smat)this.smat.uniforms.uFlip.value=f?1:0; }
  get h(){ return depth(this.y)*this.unitH*this.scaleMul; }
  update(){
    const h=this.h; this.g.position.set(this.x,WH-this.y,0); this.g.scale.set(h,h,1);
    this.mesh.position.y=this.lift/h; this.mesh.rotation.z=this.rot; if(this.sh){this.sh.position.y=-0.02+this.lift/h*0.6;this.sh.rotation.z=this.rot;}
    const base=Math.round(this.y*10); if(this.gs)this.gs.renderOrder=base; if(this.sh)this.sh.renderOrder=base+1; this.mesh.renderOrder=base+2;
    if(this.gs){ const s=1/(1+this.lift/h*1.5); this.gs.material.opacity=.22*s*this.mat.uniforms.uOpacity.value; }
    this.mat.uniforms.uTime.value=clock.t; if(this.smat)this.smat.uniforms.uTime.value=clock.t;
    this.g.visible=this.visible;
  }
  hit(wx,wy,pad=30){ const h=this.h, w=h*this.aspect; return wx>this.x-w/2-pad && wx<this.x+w/2+pad && wy>this.y-h-pad && wy<this.y+pad; }
  opacity(o){ this.mat.uniforms.uOpacity.value=o; if(this.smat)this.smat.uniforms.uOpacity.value=o; }
}

/* ---------- sticker (white paper border + grey edge) from an alpha mask ---------- */
function dilate(mask,w,h,r){ // square dilation, separable
  const tmp=new Uint8Array(w*h), out=new Uint8Array(w*h);
  for(let y=0;y<h;y++){let c=0;const o=y*w;
    for(let x=0;x<Math.min(w,r);x++)c+=mask[o+x];
    for(let x=0;x<w;x++){ if(x+r<w)c+=mask[o+x+r]; if(x-r-1>=0)c-=mask[o+x-r-1]; tmp[o+x]=c>0?1:0; }}
  for(let x=0;x<w;x++){let c=0;
    for(let y=0;y<Math.min(h,r);y++)c+=tmp[y*w+x];
    for(let y=0;y<h;y++){ if(y+r<h)c+=tmp[(y+r)*w+x]; if(y-r-1>=0)c-=tmp[(y-r-1)*w+x]; out[y*w+x]=c>0?1:0; }}
  return out;
}
function roundDilate(mask,w,h,r){ // approx round: two square passes with half radius + diagonal feel
  return dilate(dilate(mask,w,h,Math.ceil(r*0.6)),w,h,Math.ceil(r*0.45));
}
/* draws src canvas (with alpha) onto a new canvas with a sticker border */
function stickerize(src,border){
  const pad=border+6, w=src.width+pad*2, h=src.height+pad*2;
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  x.drawImage(src,pad,pad); const d=x.getImageData(0,0,w,h).data;
  const m=new Uint8Array(w*h); for(let i=0;i<w*h;i++) m[i]=d[i*4+3]>60?1:0;
  const outer=roundDilate(m,w,h,border), edge=roundDilate(outer,w,h,2);
  const o=document.createElement('canvas'); o.width=w; o.height=h; const ox=o.getContext('2d');
  const id=ox.createImageData(w,h), od=id.data;
  for(let i=0;i<w*h;i++){ if(edge[i]){ const p=i*4; if(outer[i]){od[p]=253;od[p+1]=251;od[p+2]=246;}else{od[p]=150;od[p+1]=146;od[p+2]=140;} od[p+3]=255; } }
  ox.putImageData(id,0,0);
  // soften edge
  const s=document.createElement('canvas'); s.width=w; s.height=h; const sx=s.getContext('2d');
  sx.filter='blur(0.8px)'; sx.drawImage(o,0,0); sx.filter='none'; sx.drawImage(src,pad,pad);
  return s;
}

/* ---------- procedural paper props ---------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function speckle(x,w,h,n,col){ for(let i=0;i<n;i++){ x.fillStyle=col(); x.globalAlpha=.25*Math.random(); x.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*3,1+Math.random()*2);} x.globalAlpha=1; }
function drawBox(){
  const [c,x]=mk(320,250);
  x.fillStyle='#b98a5a'; x.beginPath(); x.moveTo(30,90); x.lineTo(290,90); x.lineTo(280,245); x.lineTo(40,245); x.closePath(); x.fill();
  x.fillStyle='#a8784b'; x.beginPath(); x.moveTo(30,90); x.lineTo(5,40); x.lineTo(120,30); x.lineTo(150,90); x.fill();
  x.fillStyle='#c99c6c'; x.beginPath(); x.moveTo(290,90); x.lineTo(315,35); x.lineTo(200,28); x.lineTo(170,90); x.fill();
  x.fillStyle='#4a3424'; x.beginPath(); x.moveTo(45,92); x.lineTo(275,92); x.lineTo(268,120); x.lineTo(52,120); x.fill();
  speckle(x,320,250,500,()=>Math.random()<.5?'#6b4a2c':'#e8c9a0');
  x.fillStyle='rgba(235,225,170,.85)'; x.save(); x.translate(160,170); x.rotate(-.05); x.fillRect(-90,-14,180,28); x.restore();
  x.fillStyle='#5a4a3a'; x.font='26px "Patrick Hand",cursive'; x.textAlign='center'; x.fillText('HOME?',160,180);
  x.strokeStyle='rgba(70,50,30,.5)'; x.lineWidth=2; x.strokeRect(40,120,240,0);
  return stickerize(c,9);
}
function drawStone(){
  const [c,x]=mk(240,150);
  x.fillStyle='#8f9296'; x.beginPath();
  const pts=[[20,80],[40,30],[110,12],[190,22],[228,70],[210,125],[120,140],[40,128]];
  x.moveTo(...pts[0]); for(let i=1;i<=pts.length;i++){const p=pts[i%pts.length],q=pts[(i-1)];x.quadraticCurveTo(q[0],q[1],(p[0]+q[0])/2,(p[1]+q[1])/2);} x.fill();
  const g=x.createLinearGradient(0,0,0,150); g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(0,0,0,.25)');
  x.globalCompositeOperation='source-atop'; x.fillStyle=g; x.fillRect(0,0,240,150);
  speckle(x,240,150,700,()=>Math.random()<.5?'#55585c':'#d6d8da'); x.globalCompositeOperation='source-over';
  return stickerize(c,7);
}
function drawHole(){
  const [c,x]=mk(260,110);
  const g=x.createRadialGradient(130,55,10,130,55,125); g.addColorStop(0,'#2a1a10'); g.addColorStop(.7,'#4a3020'); g.addColorStop(1,'rgba(74,48,32,0)');
  x.fillStyle=g; x.beginPath(); x.ellipse(130,55,125,50,0,0,7); x.fill();
  speckle(x,260,110,300,()=>Math.random()<.5?'#7a5434':'#1a0f08');
  for(let i=0;i<6;i++){x.strokeStyle='rgba(240,235,220,.6)';x.lineWidth=1.5;x.beginPath();x.moveTo(60+i*28,60);x.bezierCurveTo(70+i*25,40,90+i*20,80,100+i*22,50);x.stroke();} // tiny myzel threads
  return c;
}
function drawFlower(){
  const [c,x]=mk(300,460);
  x.strokeStyle='#4f8a3c'; x.lineWidth=14; x.lineCap='round'; x.beginPath(); x.moveTo(150,455); x.bezierCurveTo(140,350,170,260,150,150); x.stroke();
  const leaf=(cx,cy,rot,col)=>{x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle=col;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(50,-40,110,0);x.quadraticCurveTo(50,30,0,0);x.fill();x.strokeStyle='rgba(30,70,30,.5)';x.lineWidth=2;x.beginPath();x.moveTo(5,0);x.lineTo(100,0);x.stroke();x.restore();};
  leaf(150,370,-.5,'#67a64a'); leaf(150,310,Math.PI+.5,'#5b9a41');
  const cols=['#f29bb8','#e9799f','#f6b6c9','#ef8aae','#f7a8be','#e67097','#f4c0cf'];
  for(let i=0;i<7;i++){x.save();x.translate(150,140);x.rotate(i/7*Math.PI*2);x.fillStyle=cols[i];x.beginPath();x.ellipse(0,-62,34,58,0,0,7);x.fill();
    x.strokeStyle='rgba(150,40,80,.35)';x.lineWidth=2;x.beginPath();x.moveTo(0,-20);x.lineTo(0,-100);x.stroke();x.restore();}
  x.fillStyle='#f3c63f'; x.beginPath(); x.arc(150,140,34,0,7); x.fill();
  speckle(x,300,460,500,()=>Math.random()<.5?'#b57d15':'#fff3c4');
  return stickerize(c,10);
}
function texFromCanvas(c){ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.NoColorSpace; t.anisotropy=4; return t; }

/* ---------- speech out ---------- */
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); const pref=['Kate','Serena','Stephanie','Martha','Daniel','Google UK English Female'];
  voice = pref.map(n=>vs.find(v=>v.name.includes(n)&&v.lang.startsWith('en'))).find(Boolean) || vs.find(v=>v.lang==='en-GB') || vs.find(v=>v.lang.startsWith('en')) || null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text,rate=0.92){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); if(voice)u.voice=voice; u.lang=voice?voice.lang:'en-GB'; u.rate=rate; u.pitch=1.05;
  u.onstart=()=>duck(true); u.onend=()=>duck(false); speechSynthesis.speak(u); }

/* ---------- music ---------- */
let actx=null, gain=null, musicOn=true, musicEl=null; const tracks=['../music/track1.mp3','../music/track2.mp3','../music/track3.mp3','../music/track4.mp3']; let ti=0;
function startMusic(){
  if(actx) return; try{
    actx=new (window.AudioContext||window.webkitAudioContext)(); gain=actx.createGain(); gain.gain.value=musicOn?0.22:0; gain.connect(actx.destination);
    musicEl=new Audio(); musicEl.crossOrigin='anonymous'; musicEl.src=tracks[ti]; musicEl.addEventListener('ended',()=>{ti=(ti+1)%tracks.length;musicEl.src=tracks[ti];musicEl.play().catch(()=>{});});
    actx.createMediaElementSource(musicEl).connect(gain); musicEl.play().catch(()=>{});
  }catch(e){}
}
function duck(on){ if(gain&&musicOn) gain.gain.setTargetAtTime(on?0.07:0.22,actx.currentTime,.2); }
$('musicBtn').onclick=e=>{ e.stopPropagation(); musicOn=!musicOn; $('musicBtn').textContent=musicOn?'♪ on':'♪ off'; if(!actx)startMusic(); if(gain)gain.gain.setTargetAtTime(musicOn?0.22:0,actx.currentTime,.1); if(musicOn&&musicEl&&musicEl.paused)musicEl.play().catch(()=>{}); };

/* ---------- UI helpers ---------- */
function toScreen(wx,wy){ const r=canvas.getBoundingClientRect(); return [(wx-cam.left)/viewW*r.width, ((WH-wy)-cam.top)/(-viewH)*r.height]; }
let bubbleAnchor=null;
function bubble(anchor,text,btns=[]){
  bubbleAnchor=anchor; $('btext').innerHTML=text; const b=$('bbtns'); b.innerHTML='';
  btns.forEach(([label,fn,cls])=>{const e=document.createElement('button');e.textContent=label;if(cls)e.className=cls;e.onclick=ev=>{ev.stopPropagation();fn();};b.appendChild(e);});
  $('bubble').style.display=text?'block':'none';
}
function hideBubble(){ bubbleAnchor=null; $('bubble').style.display='none'; }
let ringAnchor=null;
function chip(word){
  if([...document.querySelectorAll('.chip')].some(c=>c.textContent===word)) return;
  const c=document.createElement('button'); c.className='chip new'; c.textContent=word; c.onclick=e=>{e.stopPropagation();say(word,0.85);}; $('chips').appendChild(c);
}
function confetti(){ const cols=['#f29bb8','#f3c63f','#67a64a','#8ec5e8','#e9799f','#fff']; for(let i=0;i<60;i++){const b=document.createElement('div');b.className='bit';b.style.left=Math.random()*100+'vw';b.style.background=cols[i%cols.length];b.style.animationDelay=Math.random()*.6+'s';b.style.animationDuration=(1.6+Math.random()*1.4)+'s';$('confetti').appendChild(b);setTimeout(()=>b.remove(),3800);} }
function panel(html){ $('card').innerHTML=html; $('panel').style.display='flex'; }
function closePanel(){ $('panel').style.display='none'; }

/* ---------- load assets ---------- */
const loader=new THREE.TextureLoader();
const load=u=>new Promise((res,rej)=>loader.load(u,t=>{t.colorSpace=THREE.NoColorSpace;t.anisotropy=4;res(t);},undefined,rej));
let emmi,fluffi,box,stone,hole,flower,cat=null;
const [bgT,emT,flT]=await Promise.all([load('img/bg.jpg'),load('img/emmi.png'),load('img/fluffi.png')]);
{ const m=new THREE.MeshBasicMaterial({map:bgT,depthTest:false,depthWrite:false}); const bg=new THREE.Mesh(new THREE.PlaneGeometry(WW,WH),m); bg.position.set(WW/2,WH/2,0); bg.renderOrder=-1; scene.add(bg); }
emmi=new Paper(emT,emT.image.width/emT.image.height,EMMI_H*1.0,{amp:0.8}); emmi.x=960; emmi.y=1040;
fluffi=new Paper(flT,flT.image.width/flT.image.height,EMMI_H*0.78,{amp:0.9}); fluffi.x=760; fluffi.y=1010;
const boxC=drawBox(); box=new Paper(texFromCanvas(boxC),boxC.width/boxC.height,0.42,{amp:0.4}); box.x=470; box.y=905;
const holeC=drawHole(); hole=new Paper(texFromCanvas(holeC),holeC.width/holeC.height,0.13,{amp:0,shadow:false,ground:false}); hole.x=1270; hole.y=985; hole.visible=false;
const stC=drawStone(); stone=new Paper(texFromCanvas(stC),stC.width/stC.height,0.17,{amp:0.25}); stone.x=1270; stone.y=990;
const flC=drawFlower(); flower=new Paper(texFromCanvas(flC),flC.width/flC.height,0.62,{amp:1.1}); flower.x=1270; flower.y=987; flower.scaleMul=0.001; flower.visible=false;

/* ---------- state ---------- */
const S={ target:null, onArrive:null, walking:false, catDone:false, stoneDone:false, busy:false, started:false };
function walkTo(x,y,cb){ [x,y]=clampWalk(x,y); S.target=[x,y]; S.onArrive=cb||null; hideBubble(); }

/* ---------- input ---------- */
function worldFromEvent(ev){ const r=canvas.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width, py=(ev.clientY-r.top)/r.height; return [cam.left+px*viewW, WH-(cam.top-py*viewH)]; }
canvas.addEventListener('pointerdown',ev=>{
  if(!S.started||S.busy) return; const [wx,wy]=worldFromEvent(ev);
  $('hint').style.opacity=0;
  if(cat && cat.hit(wx,wy,20)){ say(cat.word); bubble(cat,`<b>${cat.word}</b>`); return; }
  if(box.hit(wx,wy)){ walkTo(box.x+150,box.y+40,()=>{ emmi.setFlip(true); boxTalk(); }); return; }
  if(stone.visible && stone.hit(wx,wy,40)){ walkTo(stone.x-120,stone.y+30,()=>{ emmi.setFlip(false); stoneTalk(); }); return; }
  if(flower.visible && flower.hit(wx,wy)){ say('flower'); return; }
  if(emmi.hit(wx,wy,0)){ say('Hello! I am Emmi.'); return; }
  if(fluffi.hit(wx,wy,0)){ say('Woof! Fluffi.'); return; }
  walkTo(wx,wy);
});

/* ---------- story bits ---------- */
function boxTalk(){
  if(S.catDone){ bubble(box,'The cat loves its new home! 💛'); say('The cat loves its new home!'); return; }
  bubble(box,'<i>Meow?</i> &nbsp;A cat needs a home.<br><b>Can you draw a cat?</b>',[['✏️ Yes, I can!',startScan,'go'],['🔊',()=>say('Meow? A cat needs a home. Can you draw a cat?')]]);
  say('Meow? A cat needs a home. Can you draw a cat?');
}
function stoneTalk(){
  if(S.stoneDone) return;
  chip('stone'); say('A grey stone. Lift it up!');
  bubble(stone,'A grey <b>stone</b>.<br>It is loose …',[['💪 Lift it!',liftStone,'go']]);
}
function liftStone(){
  hideBubble(); S.busy=true; S.stoneDone=true; ringAnchor=null; hole.visible=true;
  const t0=clock.t; anims.push(t=>{ const k=Math.min(1,(t-t0)/1.2); stone.lift=Math.sin(k*Math.PI)*120+k*10; stone.x=1270+k*170; stone.y=990+k*20; stone.rot=-k*0.6; if(k>=1){ stone.lift=0; stone.rot=-0.15; growFlower(); return true; } });
}
function growFlower(){
  flower.visible=true; const t0=clock.t;
  anims.push(t=>{ const k=Math.min(1,(t-t0)/2.2); const e=1-Math.pow(1-k,3); flower.scaleMul=Math.max(0.001,e*(1+0.12*Math.sin(k*Math.PI*3)*(1-k))); if(k>=1){flower.scaleMul=1;S.busy=false;
    chip('flower'); confetti(); say('Look! A flower! Under the grey stone, the ground is alive.'); bubble(flower,'A <b>flower</b>! 🌸<br><span class="small">Under the stone, the ground is alive.</span>'); setTimeout(()=>{ if(S.catDone) finale(); },5000); return true;} });
}
function finale(){ $('hint').textContent='Prototype: done! ✨  Next: more stones, trees, the underground …'; $('hint').style.opacity=1; }

/* ---------- scan flow ---------- */
let scanCanvas=null;
function startScan(){
  hideBubble();
  panel(`<h2>Draw a cat 🐱</h2>Use white paper and a dark pen.<br>Draw big, then take a photo.<div class="row"><label class="btn" for="scanfile">📷 Take photo</label><button onclick="window.__close()">Later</button></div><div class="small" style="margin-top:10px">Tip: good light, paper fills the photo.</div>`);
}
window.__close=()=>closePanel();
$('scanfile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  panel('<h2>Cutting out …</h2>✂️'); await new Promise(r=>setTimeout(r,50));
  try{ const img=await loadImg(URL.createObjectURL(f)); scanCanvas=cutout(img); }catch(err){ scanCanvas=null; console.error(err); }
  if(!scanCanvas){ panel(`<h2>Hmm …</h2>I can't see a drawing.<br>Try dark lines on white paper.<div class="row"><label class="btn" for="scanfile">📷 Again</label><button onclick="window.__close()">Later</button></div>`); return; }
  panel(`<h2>Your drawing!</h2><img id="preview"><div class="row"><button class="go" id="useBtn">✓ Use it</button><label class="btn" for="scanfile" style="background:#fff;border-color:#8d8577">📷 Again</label></div>`);
  $('preview').src=scanCanvas.toDataURL(); $('useBtn').onclick=nameIt;
});
function loadImg(src){ return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;}); }

function cutout(img){
  const MAX=900; let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const [c,x]=mk(w,h); x.drawImage(img,0,0,w,h); const id=x.getImageData(0,0,w,h), d=id.data, N=w*h;
  // 1. paper colour per block (bright percentile) -> white balance / shadow removal
  const B=24, bw=Math.ceil(w/B), bh=Math.ceil(h/B), bg=new Float32Array(bw*bh*3);
  const valid=new Uint8Array(bw*bh);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){ const L=[]; for(let y=by*B;y<Math.min(h,(by+1)*B);y+=2)for(let xx=bx*B;xx<Math.min(w,(bx+1)*B);xx+=2){const p=(y*w+xx)*4;const mx=Math.max(d[p],d[p+1],d[p+2]),mn=Math.min(d[p],d[p+1],d[p+2]);if(mx-mn<30&&mx>60)L.push([d[p]+d[p+1]+d[p+2],p]);}
    if(L.length<8) continue; L.sort((a,b)=>a[0]-b[0]); const p=L[Math.floor(L.length*0.85)][1]; const o=(by*bw+bx)*3; bg[o]=d[p];bg[o+1]=d[p+1];bg[o+2]=d[p+2]; valid[by*bw+bx]=1; }
  // per block: brightest valid paper sample in a 5x5 neighbourhood (whole RGB triple, keeps paper tint neutral)
  const bg2=new Float32Array(bg.length);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){ const C=[[],[],[]]; for(let r=2;r<=14&&C[0].length<5;r+=3){C[0]=[];C[1]=[];C[2]=[]; for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const X=bx+i,Y=by+j; if(X<0||Y<0||X>=bw||Y>=bh||!valid[Y*bw+X])continue; const q=(Y*bw+X)*3; C[0].push(bg[q]);C[1].push(bg[q+1]);C[2].push(bg[q+2]);}}
    const o=(by*bw+bx)*3; for(let k=0;k<3;k++){ const a=C[k].sort((u,v)=>u-v); bg2[o+k]=a.length?a[Math.floor(a.length*0.6)]:235; } }
  const nd=new Uint8ClampedArray(N*4), ink=new Uint8Array(N);
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){ const fx=Math.min(bw-1.001,Math.max(0,xx/B-0.5)), fy=Math.min(bh-1.001,Math.max(0,y/B-0.5)), x0=Math.floor(fx),y0=Math.floor(fy),ax=fx-x0,ay=fy-y0; const p=(y*w+xx)*4;
    let r=0,g=0,bl=0; for(let k=0;k<3;k++){ const v=(bg2[(y0*bw+x0)*3+k]*(1-ax)+bg2[(y0*bw+x0+1)*3+k]*ax)*(1-ay)+(bg2[((y0+1)*bw+x0)*3+k]*(1-ax)+bg2[((y0+1)*bw+x0+1)*3+k]*ax)*ay; const n=Math.min(255,d[p+k]/Math.max(30,v)*255); nd[p+k]=n; if(k==0)r=n;else if(k==1)g=n;else bl=n; }
    nd[p+3]=255; const lum=0.3*r+0.59*g+0.11*bl, sat=Math.max(r,g,bl)-Math.min(r,g,bl); ink[y*w+xx]=(lum<200||sat>55)?1:0; }
  // 2. connect strokes, label components
  const joined=dilate(ink,w,h,3); const lab=new Int32Array(N); let n=0; const areas=[0], touch=[0], bb=[null];
  const st=new Int32Array(N);
  for(let i=0;i<N;i++){ if(!joined[i]||lab[i])continue; n++; let sp=0; st[sp++]=i; lab[i]=n; let a=0,t=0,x0=w,x1=0,y0=h,y1=0;
    while(sp){ const j=st[--sp]; a++; const jx=j%w, jy=(j/w)|0; if(jx<3||jy<3||jx>w-4||jy>h-4)t++; if(jx<x0)x0=jx;if(jx>x1)x1=jx;if(jy<y0)y0=jy;if(jy>y1)y1=jy;
      const nb=[j-1,j+1,j-w,j+w]; for(const q of nb){ if(q<0||q>=N)continue; if((q%w)-(jx)>1||(jx)-(q%w)>1)continue; if(joined[q]&&!lab[q]){lab[q]=n;st[sp++]=q;} } }
    areas.push(a); touch.push(t); bb.push([x0,y0,x1,y1]); }
  // pick: largest component not mostly on border; plus others >12% of it
  let best=0; for(let i=1;i<=n;i++){ if(touch[i]>areas[i]*0.05) continue; if(!best||areas[i]>areas[best])best=i; }
  if(!best||areas[best]<N*0.004) return null;
  const keep=new Uint8Array(n+1); for(let i=1;i<=n;i++) if(i===best||(areas[i]>areas[best]*0.12&&touch[i]<=areas[i]*0.05)) keep[i]=1;
  const m=new Uint8Array(N); for(let i=0;i<N;i++) if(lab[i]&&keep[lab[i]]) m[i]=1;
  // 3. fill holes: flood outside
  const out=new Uint8Array(N); let sp=0; const push=i=>{ if(!m[i]&&!out[i]){out[i]=1;st[sp++]=i;} };
  for(let xx=0;xx<w;xx++){push(xx);push((h-1)*w+xx);} for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
  while(sp){ const j=st[--sp], jx=j%w; if(jx>0)push(j-1); if(jx<w-1)push(j+1); if(j>=w)push(j-w); if(j<N-w)push(j+w); }
  let X0=w,X1=0,Y0=h,Y1=0; for(let i=0;i<N;i++) if(!out[i]){ const xx=i%w,y=(i/w)|0; if(xx<X0)X0=xx;if(xx>X1)X1=xx;if(y<Y0)Y0=y;if(y>Y1)Y1=y; }
  // 4. compose: drawing (normalized colours) inside the filled shape
  const cw=X1-X0+1, ch=Y1-Y0+1; const [o,ox]=mk(cw,ch); const oid=ox.createImageData(cw,ch), od=oid.data;
  for(let y=0;y<ch;y++)for(let xx=0;xx<cw;xx++){ const i=(y+Y0)*w+xx+X0; if(out[i])continue; const p=i*4,q=(y*cw+xx)*4; od[q]=nd[p];od[q+1]=nd[p+1];od[q+2]=nd[p+2];od[q+3]=255; }
  ox.putImageData(oid,0,0);
  return stickerize(o,Math.max(8,Math.round(Math.max(cw,ch)*0.022)));
}

/* ---------- naming ---------- */
const ANIMALS=['cat','dog','bird','fish','mouse','rabbit','horse','cow','pig','duck','frog','snake','lion','tiger','bear','fox','owl','hamster','turtle','sheep','goat','hedgehog','butterfly','bee','spider','snail','elephant','monkey','giraffe','dinosaur','unicorn','dragon','tree','flower','house','car','sun'];
const CAT_SOUNDS=['cat','cats','kat','kitty','kitten','cut','cad','cap','kit','catt'];
function nameIt(){
  closePanel();
  const sr=window.SpeechRecognition||window.webkitSpeechRecognition;
  panel(`<h2>What is it?</h2>Say it or write it.<div class="row">${sr?'<button id="mic">🎤 Say it</button>':''}<input type="text" id="nm" placeholder="…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="go" id="okBtn">OK</button></div><div class="small" id="srmsg" style="margin-top:8px"></div>`);
  const inp=$('nm'); $('okBtn').onclick=()=>evalName([inp.value],false); inp.onkeydown=e=>{if(e.key==='Enter')evalName([inp.value],false);};
  if(sr) $('mic').onclick=()=>listen(sr);
}
function listen(SR){
  const r=new SR(); r.lang='en-GB'; r.maxAlternatives=5; r.interimResults=false; const mic=$('mic'); mic.classList.add('on'); mic.textContent='🎤 listening …'; duck(true);
  r.onresult=e=>{ const alts=[...e.results[0]].map(a=>a.transcript); $('nm').value=alts[0]||''; evalName(alts,true); };
  r.onerror=e=>{ $('srmsg').textContent= e.error==='not-allowed'||e.error==='service-not-allowed' ? 'Microphone is off – just write it.' : 'I did not hear you. Try again or write it.'; };
  r.onend=()=>{ mic.classList.remove('on'); mic.textContent='🎤 Say it'; duck(false); };
  try{ r.start(); }catch(e){ $('srmsg').textContent='Write it, please.'; }
}
function evalName(alts,spoken){
  const words=alts.flatMap(a=>a.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/)).filter(Boolean);
  if(!words.length){ $('srmsg').textContent='Write a word, please.'; return; }
  const isCat = words.some(w=>spoken?CAT_SOUNDS.includes(w):['cat','cats','kitty','kitten'].includes(w));
  if(isCat) return placeDrawing('cat',true);
  const known=words.find(w=>ANIMALS.includes(w)||ANIMALS.includes(w.replace(/s$/,'')));
  if(known) return placeDrawing(known.replace(/s$/,'')==='mouse'?'mouse':(ANIMALS.includes(known)?known:known.replace(/s$/,'')),false);
  const w=words[0]; $('srmsg').innerHTML=`Hmm, “${w}”? I don't know that word yet. <button id="hintCat" style="font-size:18px">🔊 cat</button>`; $('hintCat').onclick=()=>say('cat');
}
function placeDrawing(word,isCat){
  closePanel(); const tex=texFromCanvas(scanCanvas); const a=scanCanvas.width/scanCanvas.height;
  const p=new Paper(tex,a,a>1.3?0.36:0.46,{amp:1}); p.word=word; p.x=emmi.x-60; p.y=Math.min(1040,emmi.y+10); p.hop=Math.random()*3;
  p.home=isCat?[box.x+20,box.y+25]:[emmi.x-140,emmi.y]; p.homeSet=true; critters.push(p);
  chip(word); confetti();
  if(isCat){ cat=p; S.catDone=true; say('A cat! Well done! The cat has a new home.'); setTimeout(()=>bubble(box,'A <b>cat</b>! 🐱<br>Thank you, Emmi!'),300);
    setTimeout(()=>{ if(!S.stoneDone){ ringAnchor=stone; say('Look! One stone is loose.'); bubble(stone,'Look! One <b>stone</b> is loose …'); } else finale(); },5200);
  } else { if(!cat) cat=p; say(`A ${word}! How nice! But the box still wants a cat.`); bubble(emmi,`A <b>${word}</b>! 💛<br><span class="small">The box still wants a cat …</span>`,[['✏️ Draw a cat',startScan,'go']]); }
}
const critters=[];

/* ---------- loop ---------- */
const anims=[];
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; clock.t+=dt;
  // emmi walking
  if(S.target){ const [tx,ty]=S.target, dx=tx-emmi.x, dy=ty-emmi.y, dist=Math.hypot(dx,dy*1.6); const sp=depth(emmi.y)*1.15*dt*1.0+120*dt;
    if(dist<6){ S.target=null; emmi.rot=0; emmi.lift=0; const cb=S.onArrive; S.onArrive=null; cb&&cb(); }
    else { const k=Math.min(1,sp/dist); emmi.x+=dx*k; emmi.y+=dy*k; if(Math.abs(dx)>4) emmi.setFlip(dx<0); emmi.walkT=(emmi.walkT||0)+dt*9; emmi.rot=Math.sin(emmi.walkT)*0.045; emmi.lift=Math.abs(Math.sin(emmi.walkT))*depth(emmi.y)*0.03; } }
  else { emmi.rot*=0.85; emmi.lift*=0.8; }
  // fluffi follows
  { const side = emmi.flip?1:-1; const gx=emmi.x+side*depth(emmi.y)*0.55, gy=Math.min(1040,emmi.y-18); const dx=gx-fluffi.x, dy=gy-fluffi.y, d=Math.hypot(dx,dy);
    if(d>depth(emmi.y)*0.3){ const sp=(depth(fluffi.y)*1.3+150)*dt; const k=Math.min(1,sp/d); fluffi.x+=dx*k; fluffi.y+=dy*k; if(Math.abs(dx)>3)fluffi.setFlip(dx>0); fluffi.walkT=(fluffi.walkT||0)+dt*11; fluffi.rot=Math.sin(fluffi.walkT)*0.03; fluffi.lift=Math.abs(Math.sin(fluffi.walkT))*depth(fluffi.y)*0.025; }
    else { fluffi.rot*=0.85; fluffi.lift*=0.8; } }
  // critters hop
  for(const c of critters){ c.hop+=dt; const ph=c.hop%2.4; if(ph<0.5){ const k=ph/0.5; c.lift=Math.sin(k*Math.PI)*depth(c.y)*0.12; c.scaleMulY=1; }
    else { c.lift=0; if(ph>2.35 && !c.moved){ c.moved=true; } }
    if(ph<0.02){ c.moved=false; c.tx=c.home[0]+(Math.random()-.5)*120; c.ty=Math.min(1040,c.home[1]+(Math.random()-.5)*40); }
    if(c.tx!==undefined && ph<0.5){ c.x+=(c.tx-c.x)*dt*3; c.y+=(c.ty-c.y)*dt*3; if(Math.abs(c.tx-c.x)>3)c.setFlip(c.tx>c.x?false:true); }
    c.rot=ph<0.5?Math.sin(ph/0.5*Math.PI)*0.12*(c.flip?1:-1):0; }
  for(let i=anims.length-1;i>=0;i--) if(anims[i](clock.t)) anims.splice(i,1);
  // camera follow (horizontal)
  const want=Math.max(0,Math.min(WW-viewW,emmi.x-viewW/2)); camX+=(want-camX)*Math.min(1,dt*3); placeCam();
  for(const p of allPapers) p.update();
  // html anchors
  if(bubbleAnchor){ const [sx,sy]=toScreen(bubbleAnchor.x,bubbleAnchor.y-bubbleAnchor.h-bubbleAnchor.lift-10); const b=$('bubble'); b.style.left=Math.max(140,Math.min(innerWidth-140,sx))+'px'; b.style.top=Math.max(b.offsetHeight+10,sy)+'px'; }
  if(ringAnchor){ const [sx,sy]=toScreen(ringAnchor.x,ringAnchor.y-ringAnchor.h*0.4); const r=$('ring'); r.style.display='block'; r.style.left=sx+'px'; r.style.top=sy+'px'; } else $('ring').style.display='none';
  renderer.render(scene,cam); requestAnimationFrame(tick);
}
resize(); requestAnimationFrame(tick);
window.__dbg={toScreen,get box(){return box},get stone(){return stone},get cat(){return cat},S};

$('loadmsg').textContent=''; $('startBtn').style.display='block';
$('startBtn').onclick=()=>{ $('load').style.display='none'; S.started=true; startMusic(); say('Greystone. Grey houses, grey stones. Everything is grey.'); setTimeout(()=>{ ringAnchor=null; bubble(box,'<i>Meow …?</i>'); },3500); };
</script>
