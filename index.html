<title>Emmi und Armi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat+Brush&display=swap">
<style>
/* Layout: comic book pages on paper, 6-column panel grid, text bubbles under each picture; one theme on purpose (paper + ink) */
:root{
  --desk:#d9d2c3;      /* table under the book */
  --paper:#fbf8f1;     /* page */
  --ink:#221d18;       /* outlines, text */
  --muted:#6f665b;
  --caption:#f6e7a6;   /* narration boxes */
  --glow:#e8742c;      /* myzel glow / accent */
  --moss:#3f7d52;
  --easy:#7cbf6a; --mid:#e9c43f; --hard:#ec8a3a;
  --ok:#2f8a4a; --bad:#c2412f; --typed:#1f5a35;
  --f-display:"Caveat Brush","Marker Felt","Comic Sans MS",cursive;
  --f-body:"Andika","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:light;
}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.35;padding-inline:16px;padding-block:0 48px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1100px;margin-inline:auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;line-height:1}
.brand span{color:var(--muted);font-size:.9rem}
.chap select{font:inherit;font-size:.95rem;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);padding:5px 8px;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
nav{display:flex;gap:6px}
nav button{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.bar{max-width:1100px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 14px}
.bar b{font-variant-numeric:tabular-nums}
.bar .go{margin-left:auto;display:flex;gap:8px}
.btn{border:2px solid var(--ink);border-radius:8px;background:var(--glow);color:#fff;font-weight:700;padding:6px 14px;cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink)}
.legend{display:flex;gap:12px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
#msg{font-weight:700}

.book{max-width:1100px;margin-inline:auto;display:grid;gap:28px}
.page{background:var(--paper);padding:18px;border-radius:3px;box-shadow:0 1px 0 #0002,0 12px 28px -14px #0006;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;position:relative}
.page .no{position:absolute;bottom:4px;right:14px;font-family:var(--f-display);color:var(--muted)}
.panel{grid-column:span 3;border:3px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;min-width:0}
.panel.w{grid-column:span 6}
.panel.t{grid-column:span 4}.panel.n{grid-column:span 2}
.pic{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:#ccc;border-bottom:3px solid var(--ink)}
.pic img{cursor:zoom-in}
.panel.w .pic{aspect-ratio:21/9}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .missing{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#e9e3d6 0 14px,#f2ede2 14px 28px);font-family:var(--f-display);font-size:1.4rem;color:var(--muted)}
.cap{position:absolute;left:10px;top:10px;max-width:min(70%,30rem);background:var(--caption);border:2px solid var(--ink);padding:6px 10px;font-size:.95rem;box-shadow:3px 3px 0 var(--ink)}
.cap p{margin:0}.cap p+p{margin-top:4px}
.talk{display:flex;flex-wrap:wrap;gap:10px 12px;padding:12px;align-items:flex-start}
.b{position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:7px 12px 8px;max-width:100%;min-width:0}
.b::before{content:"";position:absolute;top:-10px;left:22px;border:8px solid transparent;border-bottom:10px solid var(--ink);border-top:0}
.b::after{content:"";position:absolute;top:-6px;left:24px;border:6px solid transparent;border-bottom:8px solid #fff;border-top:0}
.b.think{border-style:dashed;border-radius:24px}
.b.think::before,.b.think::after{display:none}
.b.note{background:var(--caption);border-radius:2px;font-size:.92rem}
.b.note::before,.b.note::after{display:none}
.who{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.who .say{margin-left:auto}
.line{margin:0}
.say{border:0;background:none;padding:0;width:22px;height:22px;cursor:pointer;color:var(--muted);flex:none}
.say svg{width:18px;height:18px}
.say.inl{display:inline-flex;vertical-align:middle;width:20px;height:20px}
.music{display:flex;align-items:center;gap:6px}
.music button{border:2px solid var(--ink);background:var(--paper);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1rem;line-height:1}
.music button[aria-pressed="false"]{opacity:.45}
.music input{width:90px;accent-color:var(--glow)}
@media (pointer:coarse){.gap input{font-size:1.15em;min-height:1.9em;padding:2px 8px;min-width:6ch}}

.v{cursor:pointer;font-weight:700;border-bottom:3px solid var(--easy);padding-inline:1px}
.v.m{border-color:var(--mid)}.v.h{border-color:var(--hard)}
.gap{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap;vertical-align:baseline}
.gap{position:relative}
.gap input{font:inherit;font-weight:700;color:var(--typed);-webkit-text-fill-color:var(--typed);caret-color:var(--typed);opacity:1;border:0;border-bottom:2px dashed var(--ink);background:#f4efe4;padding:0 4px;min-width:3ch;max-width:100%;border-radius:3px}
.gap .tick{font-size:.85rem;color:var(--typed);font-weight:700;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.gap.filled .tick{opacity:1;transform:scale(1)}
.gap input.ok{background:#d9efdd;border-bottom:2px solid var(--ok)}
.gap input.no{background:#f8dcd6;border-bottom:2px solid var(--bad)}
.gap input.shown{background:#eee;color:var(--muted);border-bottom:2px solid var(--muted)}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}

#key{max-width:760px;margin-inline:auto;background:var(--paper);padding:20px;border:3px solid var(--ink)}
#key h2{font-family:var(--f-display);font-weight:400;font-size:1.8rem;margin:0 0 4px}
#key p{color:var(--muted);margin:0 0 12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td{padding:7px 8px;border-bottom:1px solid #0001;vertical-align:middle}
td.en{font-weight:700}
.lvl{display:inline-block;width:12px;height:12px;border-radius:50%}

.endcard{background:var(--paper);border:3px solid var(--ink);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.endcard p{margin:0;max-width:60ch;min-width:0}
#key .ans{display:inline-block;font-weight:700;padding:0 6px;border-radius:4px}
#key .ans.ok{background:#d9efdd;color:var(--ok)}
#key .ans.no{background:#f8dcd6;color:var(--bad)}
#key .ans.empty{background:#eee;color:var(--muted);font-weight:400}
#key .sum{font-size:1.15rem;font-weight:700;color:var(--ink)}
#key .ctx{color:var(--muted);font-size:.92rem}
#key h3{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:22px 0 4px}
#key td.st{width:28px;font-weight:700;text-align:center}
.prac input{font:inherit;font-weight:700;color:var(--typed);-webkit-text-fill-color:var(--typed);border:2px solid var(--ink);border-radius:6px;padding:2px 6px;width:12ch;background:#fff}
.prac input.ok{background:#d9efdd}.prac input.no{background:#f8dcd6}
.tap{touch-action:manipulation;-webkit-tap-highlight-color:transparent;flex:1 1 40px;align-self:stretch;min-height:40px}
.lab{position:absolute;right:6px;top:6px;background:#1d4f7a;color:#fff;font:700 .8rem/1 var(--f-body);padding:4px 7px;border-radius:6px;z-index:2;pointer-events:none}
body.review{--desk:#cfe2f1}
.donebox{border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);padding:22px;max-width:min(92vw,440px)}
.donebox::backdrop{background:#0008}
.donebox h2{font-family:var(--f-display);font-weight:400;font-size:2.2rem;margin:0 0 6px}
.donebox .go{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.reviewnote{background:#1d4f7a!important;position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;background:var(--ink);color:var(--paper);font-size:.8rem;padding:4px 10px;border-radius:999px}
#tip{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:20;max-width:calc(100% - 32px);font-size:1rem}
#zoom{border:0;padding:0;background:transparent;max-width:min(96vw,1400px)}
#zoom::backdrop{background:#000c}
#zoom img{display:block;max-width:100%;max-height:88vh;border:3px solid var(--paper)}
#zoom button{position:absolute;top:8px;right:8px}

@media (max-width:760px){
  .panel,.panel.t,.panel.n{grid-column:span 6}
  .panel.w .pic{aspect-ratio:4/3}
  .page{padding:10px}
  body{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){ .pic img{transition:transform .4s} .pic:hover img{transform:scale(1.02)} }
</style>

<header>
  <div class="brand"><h1>Emmi &amp; Armi</h1><label class="chap"><span class="sr">Chapter</span><select id="chsel"></select></label></div><div class="tap" id="tapzone" aria-hidden="true"></div>
  <div class="music"><button id="mbtn" aria-pressed="true" aria-label="Music on/off">♪</button><input id="mvol" type="range" min="0" max="1" step="0.05" aria-label="Music volume"></div>
  <nav aria-label="Mode">
    <button data-mode="read" aria-selected="true">Read</button>
    <button data-mode="gaps" aria-selected="false">Fill in</button>
    <button data-mode="key" aria-selected="false">Answers</button>
  </nav>
</header>

<div class="bar" id="readbar">
  <span>Tap a <b>bold word</b> to hear it. Tap the speaker to hear the whole line.</span>
  <span class="legend"><span><i style="background:var(--hard)"></i>hard</span><span><i style="background:var(--mid)"></i>medium</span><span><i style="background:var(--easy)"></i>easy</span></span>
</div>
<div class="bar" id="gapbar" hidden>
  <span>Filled <b id="cnt">0 / 0</b></span><span id="msg"></span>
  <span class="go"><button class="btn" id="toKey">Check in Answers</button></span>
</div>

<main class="book" id="book"></main>
<section id="key" hidden></section>

<div id="tip" hidden></div>
<dialog id="done" class="donebox"><h2>Chapter done!</h2><p></p><div class="go"><button class="btn ghost" id="stay">Stay here</button><button class="btn" id="goNext">Next chapter</button></div></dialog>
<p id="reviewnote" class="reviewnote" hidden>Review mode</p>
<dialog id="zoom"><img alt=""><button class="btn ghost" id="zclose">Close</button></dialog>

]], "c": "", "img": true, "na": ["b28c94b37ff0"]}]]}, {"id": "t0k06", "label": "Kapitel 6 · A Tour of Greystone", "pages": [[{"id": "k06p01", "n": ["Thursday. Behind the fence, Armi looks tired. Her pink is not so pink."], "l": [["s", "Emmi", "Armi? What's wrong?", "2b5d4df0fa70"]], "c": "w", "img": true, "na": ["2872ec53d07c"]}, {"id": "k06p02", "n": [], "l": [["s", "Microbes", "She is weak, Emmi. She needs her partner. Her [[tree]].", "4b792a7e1acb"], ["s", "Emmi", "Which [[tree]]? Where?", "dd03c852fcc5"], ["s", "Microbes", "Somewhere in this [[town]]. Find it!", "5853439c8cfc"]], "c": "", "img": true, "na": []}, {"id": "k06p03", "n": [], "l": [["s", "Emmi", "Ms Stone! Come with us. [[Let me show you]] something.", "3cb9195f9e7b"], ["s", "Ms Stone", "I don't have much time …", "3db881a5fdf0"], ["s", "Lina", "It's [[a tour of]] Greystone. A special one.", "e80707c09799"]], "c": "", "img": true, "na": []}, {"id": "k06p04", "n": ["They walk down the [[street]]. [[Cars]], [[bikes]], grey houses."], "l": [["s", "Ms Stone", "I know this [[street]]. I know every [[road]] in this [[town]].", "e6e841f39c09"], ["s", "Emmi", "You know what's on top. Not what's under it.", "6d45bee268f9"]], "c": "w", "img": true, "na": ["ac722c38ba3a"]}], [{"id": "k06p05", "n": [], "l": [["s", "Emmi", "Look under this [[stone]].", "2488f25d514b"], ["s", "Ms Stone", "What is that?", "ccf8a9c1ca78"], ["s", "Emmi", "Armi. She is everywhere. Under every [[street]]. Under every [[place]].", "888e6d9dab90"]], "c": "", "img": true, "na": []}, {"id": "k06p06", "n": [], "l": [["s", "Lina", "And this is the [[park]]. The [[grass]] is grey. No [[flowers]].", "7dcca5a3013e"], ["s", "Emmi", "Because the ground can't breathe. Stones, stones, stones.", "fc348bf809ef"], ["s", "Ms Stone (quietly)", "I put those stones here. Five years ago.", "f067723b14c4"]], "c": "", "img": true, "na": []}, {"id": "k06p07", "n": ["They go up to the cliff. [[By the sea]], the wind is cold. Below: the [[beach]], the [[sand]], .", "1fa8c84717a4"], ["s", "Tom", "And I … can ring [[doorbells]]!", "f9d97a983df3"], ["s", "Lina", "And we tell everyone about Armi. Two jobs in one!", "673813023911"]], "c": "", "img": true, "na": []}, {"id": "k07p03", "n": ["DING-DONG! The [[doorbell]]."], "l": [["s", "Tom", "Hello! Is a big white dog [[upstairs]]? Or [[downstairs]]?", "6c2fb0fd65ad"], ["s", "Woman", "No! Only my cat.", "debd4be0cd69"], ["s", "Tom", "OK. And did you know? Under your [[house]] lives a giant fungus!", "94406aee26e7"]], "c": "", "img": true, "na": ["d630ca7d325f"]}, {"id": "k07p04", "n": ["Jake [[runs]] and [[runs]]. He plays [[football]] with every kid in the street."], "l": [["s", "Jake", "Have you seen a dog? Big, white, red scarf? No? OK – but look at the mushroom!", "031b7041a6d8"]], "c": "w", "img": true, "na": ["e206dde46597"]}], [{"id": "k07p05", "n": [], "l": [["s", "Lina", "I send a [[message]]. To all my friends. And their friends.", "7f3ea6a28e69"], ["s", "Emmi", "What is a [[phone]]?", "c19090abc420"], ["s", "Lina", "Ugh. Later.", "e305237ce779"]], "c": "", "img": true, "na": []}, {"id": "k07p06", "n": [], "l": [["s", "Emmi", "And we put a picture in every [[parcel]]!", "8aae3b3d6fa9"], ["s", "Lina", "The [[postman]] will hate us.", "b2bf0b1ca695"], ["s", "Emmi", "No. He likes Armi. Remember his [[smile]]?", "cc04e350064e"]], "c": "", "img": true, "na": []}, {"id": "k07p07", "n": [], "l": [["s", "Zara (singing)", "Under the stones, there is a [[song]] … she's been here all along …", "6f79dbd7bc7d"], ["x", "", "People stop. Some [[dance]]. [[Music]] in Greystone!", "f8804a0b9c2a"]], "c": "w", "img": true, "na": []}, {"id": "k07p08", "n": [], "l": [["s", "Tom", "And [[balloons]]! Pink ones!", "667d18905416"], ["s", "Lina", "Is this a [[game]] now?", "37dfbb5b1077"], ["s", "Jake", "Best [[game]] ever. Better than [[hang out]] at home and [[watch a film]].", "a90054da7571"]], "c": "w", "img": true, "na": []}], [{"id": "k07p09", "n": [], "l": [["s", "Emmi", "My best friend i  "w", "img": true, "na": []}], [{"id": "k09p09", "n": ["People [[read]]. People [[think]]. People [[understand]]."], "l": [["s", "Boss (on the phone)", "Stone! What are you doing?!", "c9588582934a"], ["s", "Ms Stone", "My job. Finally.", "aa9b590767fa"]], "c": "w", "img": true, "na": ["cb88b1397a95"]}, {"id": "k09p10", "n": [], "l": [["s", "Steve", "We [[go]] to work. But a different work.", "ae87d16b342e"], ["s", "Gary", "Spades, not diggers. No [[problem]]!", "5f6b7d8f65e7"]], "c": "w", "img": true, "na": []}, {"id": "k09p11", "n": [], "l": [["s", "Flower Woman", "[[Who]] [[needs]] seeds? I [[have]] lots!", "d6e236d278f8"], ["s", "Everyone", "ME!", "50daeae6ed25"]], "c": "", "img": true, "na": []}, {"id": "k09p12", "n": ["One stone. Ten stones. A hundred stones."], "l": [["s", "Emmi (whispering)", "Armi … do you [[see]] this?", "39b7982af5bf"]], "c": "", "img": true, "na": ["57424ee3dead"]}]]}, {"id": "t0k10", "label": "Kapitel 10 · Greengarden", "pages": [[{"id": "k10p01", "n": ["Monday. [[The]] square can breathe. And Armi is pink again – [[so]] pink."], "l": [], "c": "w", "img": true, "na": ["275008feea92"]}, {"id": "k10p02", "n": [], "l": [["s", "Emmi", "Hello? … HELLO! My voice! It's back!", "e84ebf4eaeb1"], ["s", "Microbes", "Because [[we]] are free [[too]]!", "02df93229be5"]], "c": "", "img": true, "na": []}, {"id": "k10p03", "n": [], "l": [["s", "Lina", "Emmi! [[You're]] loud again!", "d6bef9129027"], ["s", "Emmi", "[[Maybe]] [[too]] loud?", "ab306acfb87e"], ["s", "Jake", "No such thing!", "12e42fd56322"]], "c": "", "img": true, "na": []}, {"id": "k10p04", "n": ["[[Some]] plant flowers. [[Some]] plant trees. Mrs Lee is [[here]] [[with]] [[her class]]."], "l": [["s", "Mrs Lee", "Today, [[our]] classroom is outside!", "a3a243ed3f39"]], "c": "w", "img": true, "na": ["07ff4bbff527"]}], [{"id": "k10p05", "n": [], "l": [["s", "Jake", "[[Dad]]? [[You're]] [[here]]?", "8448288e227f"], ["s", "Mr Carter", "Of course. This is [[our]] town. And [[your]] mushroom is cool.", "97217a3bcf4b"]], "c": "", "img": true, "na": []}, {"id": "k10p06", "n": [], "l": [["s", "Ms Stone", "The new house stands over the garden, not on it. [[Under]] it: Armi. [[For]] [[us]] and [[for]] her.", "14047d846442"], ["s", "Emmi", "[[She's]] happy. I can feel it.", "e0bd9d8596c7"]], "c": "", "img": true, "na": []}, {"id": "k10p07", "n": [], "l": [["s", "Flower Woman", "The old name [[isn't]] right any more.", "c0d67451ae51"], ["s", "Postman", "[[So]] … [[we]] need a new one.", "7172bf9ab96a"]], "c": "w", "img": true, "na": []}, {"id": "k10p08", "n": [], "l": [["s", "Tom", "GREENGARDEN!", "5e3c359021cd"], ["s", "Everyone", "Hooray!", "fc9100493b09"]], "c": "w", "img": true, "na": []}], [{"id": "k10p09", "n": ["[[A lot of]] music. [[Lots of]] food. [[More]] colours than ever. And the slide is open again!"], "l": [["s", "Zara (singing)", "[[We]] are [[together]], under the sky …", "df420a9831fb"]], "c": "w", "img": true, "na": ["d398603cacc7"]}, {"id": "k10p10", "n": [], "l": [["s", "Lina", "[[They're]] all [[here]] because of you, Emmi.", "b404a137f67b"], ["s", "Emmi", "No. Because of [[us]]. [[Together]].", "53ac4dcd3b81"]], "c": "w", "img": true, "na": []}, {"id": "k10p11", "n": [], "l": [["s", "Lina", "[[Bye]], Emmi! [[See you]] tomorrow!", "36a520f292bc"], ["x", "", "One by one, they all go home. [[But]] not Emmi.", "a4f7ae6be529"]], "c": "", "img": true, "na": []}, {"id": "k10p12", "n": [], "l": [["s", "Emmi (quietly)", "Fluffi … everyone has a home. [[We]] have [[no]] home.", "c0447fb21934"], ["s", "Fluffi", "…woof.", "7fac14a2ff2b"]], "c": "", "img": true, "na": []}]]}];
let CUR=0,PAGES=CH[0].pages,HAVE=new Set();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const spk='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const plain=t=>t.replace(/\[\[([^\]]+)\]\]/g,"$1");
function parse(t){const out=[],re=/\[\[([^\]]+)\]\]/g;let i=0,m;while((m=re.exec(t))){if(m.index>i)out.push({t:t.slice(i,m.index)});const k=m[1].toLowerCase(),d=VOC[k]||["e",""];out.push({v:m[1],l:d[0],de:d[1]});i=re.lastIndex}if(i<t.length)out.push({t:t.slice(i)});return out}

/* speech */
let voice=null;
function pick(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function tts(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/…/g,", ").replace(/_+/g,"blank"));if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=.85;speechSynthesis.speak(u)}
const VA=new Audio();VA.preload="auto";
function say(text,a){const id=a||(typeof WA!=="undefined"&&WA[String(text||"").toLowerCase()]);
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(!id){tts(text);return}
  VA.pause();VA.onerror=()=>{duck(false);tts(text)};VA.src="audio/"+id+".mp3";duck(true);VA.play().catch(()=>{duck(false);tts(text)})}
VA.addEventListener("ended",()=>duck(false));VA.addEventListener("pause",()=>duck(false));

/* music: playlist, volume slider, on/off; ducks while a voice speaks */
const TRACKS=["music/track1.mp3","music/track2.mp3","music/track3.mp3","music/track4.mp3"];
const MU=new Audio();MU.preload="none";let mt=0,musicOn=true,mvol=.25,ducked=false;
try{const m=JSON.parse(localStorage.getItem("emmi-music")||"null");if(m){musicOn=m.on;mvol=m.v}}catch(e){}
let AC=null,GN=null; // iPad ignores audio.volume -> use Web Audio gain
function mgraph(){if(AC)return;try{const C=window.AudioContext||window.webkitAudioContext;AC=new C();GN=AC.createGain();AC.createMediaElementSource(MU).connect(GN);GN.connect(AC.destination)}catch(e){AC=null}}
function mset(){const v=Math.max(0,Math.min(1,mvol*(ducked?.3:1)));if(GN){GN.gain.value=v;MU.volume=1}else MU.volume=v}
function duck(on){ducked=on;mset()}
function mstart(){if(!musicOn)return;mgraph();if(AC&&AC.state!=="running")AC.resume();if(!MU.src)MU.src=TRACKS[mt];mset();MU.play().then(()=>{mstarted=true}).catch(()=>{mstarted=false})}
MU.addEventListener("ended",()=>{mt=(mt+1)%TRACKS.length;MU.src=TRACKS[mt];mstart()});
function msave(){try{localStorage.setItem("emmi-music",JSON.stringify({on:musicOn,v:mvol}))}catch(e){}}
let mstarted=false;function kick(){if(mstarted)return;if(!musicOn){mstarted=true;return}mstart();if(!MU.paused||MU.src)mstarted=true}
["touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,kick,{passive:true}));
const tip=document.getElementById("tip");let tipT;
function showTip(en,de){tip.innerHTML="<b>"+esc(en)+"</b> = "+esc(de);tip.hidden=false;clearTimeout(tipT);tipT=setTimeout(()=>tip.hidden=true,2600)}

/* storage: progress {r,d}, her answers + check status, hard words. Review mode uses a separate in-memory copy. */
let REVIEW=false;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let PROG=load("emmi-prog",{});
const MINE=load("emmi-ans",{a:{},c:{},w:{}});   // a: answers, c: check status ok/no, w: last wrong value (for hard-word counting)
let HARD=load("emmi-hard",{});
let RV={a:{},c:{},w:{}};
const S=()=>REVIEW?RV:MINE;
const saveAns=()=>{if(!REVIEW)save("emmi-ans",MINE)};
const arr=(o,id)=>(o[id]=o[id]||[]);
const isDone=i=>!!(PROG[CH[i].id]&&PROG[CH[i].id].d);
const isOpen=i=>REVIEW||i===0||isDone(i-1);
function mark(i,k){if(REVIEW)return;const id=CH[i].id;PROG[id]=PROG[id]||{};PROG[id][k]=1;save("emmi-prog",PROG);fillSelect()}

/* gaps in reading order (same order as render) */
function gapList(){const L=[];PAGES.flat().forEach(p=>[...p.n,...p.l.map(x=>x[2])].forEach(t=>{const segs=parse(t);segs.forEach((s,k)=>{if(s.v)L.push({ans:s.v,l:s.l,de:s.de,ctx:segs.map((x,j)=>j===k?"___":x.v||x.t).join("")})})}));return L}

/* render */
let mode="read",gi=0;
function seg(s){
  if(s.t!==undefined)return esc(s.t);
  if(mode!=="gaps")return `<span class="v ${s.l}" data-en="${esc(s.v)}" data-de="${esc(s.de)}" role="button" tabindex="0">${esc(s.v)}</span>`;
  const i=gi++,id=CH[CUR].id,val=arr(S().a,id)[i]||"",st=arr(S().c,id)[i]||"";
  const hint=s.l==="h"?`<span class="hint">(${esc(s.de)})</span>`:"";
  return `<span class="gap${val?" filled":""}"><input lang="en" inputmode="text" data-i="${i}" class="${st}" ${st==="ok"?"readonly":""} value="${esc(val)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:${Math.max(s.v.length+2,5)}ch" aria-label="missing word"><span class="tick" aria-hidden="true">✓</span>${hint}</span>`;
}
function render(){
  gi=0;
  const pages=PAGES.map((pg,pi)=>`<section class="page" aria-label="Page ${pi+1}">`+pg.map(p=>{
    const cap=p.n.length?`<div class="cap">${p.n.map((x,i)=>"<p>"+parse(x).map(seg).join("")+` <button class="say inl" data-t="${esc(plain(x))}" data-a="${(p.na||[])[i]||""}" aria-label="Listen">${spk}</button></p>`).join("")}</div>`:"";
    const img=HAVE.has(p.id)?`<img src="img/${p.id}.jpg" alt="" loading="lazy" data-id="${p.id}">`:`<span class="missing">picture coming soon</span>`;
    const lab=REVIEW?`<span class="lab">${p.id.replace(/k0?(\d+)p0?(\d+)/,"K$1 P$2")}</span>`:"";
    const talk=p.l.length?`<div class="talk">${p.l.map(([k,w,t,a])=>`<div class="b ${k==="t"?"think":k==="x"?"note":""}">${w?`<div class="who">${esc(w)}<button class="say" data-t="${esc(plain(t))}" data-a="${a||""}" aria-label="Listen">${spk}</button></div>`:""}<p class="line">${parse(t).map(seg).join("")}${!w?` <button class="say inl" data-t="${esc(plain(t))}" data-a="${a||""}" aria-label="Listen">${spk}</button>`:""}</p></div>`).join("")}</div>`:"";
    return `<article class="panel ${p.c}"><div class="pic">${img}${lab}${cap}</div>${talk}</article>`;
  }).join("")+`<span class="no">${pi+1}</span></section>`).join("");
  const end= mode==="read"
    ? `<div class="endcard"><p><b>Finished reading?</b> Now put the words back in yourself. The next chapter opens when every word is right.</p><button class="btn" id="toGaps">Fill in the gaps</button></div>`
    : `<div class="endcard"><p>Filled every gap? Then go to <b>Answers</b> and see which words are right. Red ones: come back and try again.</p><button class="btn" id="toKey2">Check in Answers</button></div>`;
  book.innerHTML=pages+end;
  if(mode==="gaps")setCount();
}
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?"]/g,"").replace(/\s+/g," ").trim();
function setCount(){const n=gapList().length,A=arr(S().a,CH[CUR].id),f=A.slice(0,n).filter(x=>x&&x.trim()).length;
  document.getElementById("cnt").textContent=`${f} / ${n}`;
  const C=arr(S().c,CH[CUR].id),no=C.filter(x=>x==="no").length;
  document.getElementById("msg").textContent=no?`${no} red – try again`:""}

const book=document.getElementById("book");
book.addEventListener("input",e=>{const inp=e.target.closest(".gap input");if(!inp)return;const i=+inp.dataset.i,id=CH[CUR].id;
  arr(S().a,id)[i]=inp.value;if(arr(S().c,id)[i]==="no"){S().c[id][i]="";inp.className=""}
  inp.parentElement.classList.toggle("filled",!!inp.value.trim());saveAns();setCount()});
book.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".gap input")){e.preventDefault();const all=[...book.querySelectorAll(".gap input:not([readonly])")],k=all.indexOf(e.target);(all[k+1]||e.target).focus()}});
book.addEventListener("click",e=>{
  if(e.target.id==="toGaps"){mark(CUR,"r");setMode("gaps");window.scrollTo(0,0);return}
  if(e.target.id==="toKey2"){setMode("key");window.scrollTo(0,0);return}
  const s=e.target.closest(".say");if(s){say(s.dataset.t,s.dataset.a);return}
  const v=e.target.closest(".v");if(v){e.stopPropagation();e.preventDefault();say(v.dataset.en);showTip(v.dataset.en,v.dataset.de);return}
  if(e.target.closest(".gap"))return;
  const im=e.target.closest(".pic img");if(im){const z=document.getElementById("zoom");z.querySelector("img").src=im.src;z.showModal()}
});
document.getElementById("toKey").onclick=()=>{setMode("key");window.scrollTo(0,0)};
document.getElementById("zclose").onclick=()=>document.getElementById("zoom").close();
document.getElementById("zoom").addEventListener("click",e=>{if(e.target.id==="zoom")e.target.close()});

/* answers = check her words: green / red, never the solution */
const order={h:0,m:1,e:2},col={h:"var(--hard)",m:"var(--mid)",e:"var(--easy)"};
function buildKey(){
  const id=CH[CUR].id,L=gapList(),A=arr(S().a,id),C=arr(S().c,id),W=arr(S().w,id);
  let right=0,filled=0;
  L.forEach((g,i)=>{const v=(A[i]||"").trim();if(!v){C[i]="";return}filled++;
    if(norm(v)===norm(g.ans)){C[i]="ok";right++}
    else{C[i]="no";if(!REVIEW&&W[i]!==norm(v)){W[i]=norm(v);const k=g.ans.toLowerCase();HARD[k]=HARD[k]||{w:g.ans,de:g.de,n:0};HARD[k].n++}}});
  saveAns();if(!REVIEW)save("emmi-hard",HARD);
  const n=L.length,all=right===n&&n>0;
  let h=`<h2>Answers</h2>`;
  if(!filled)h+=`<p>Nothing to check yet. Go to <b>Fill in</b> and put the words back first.</p>`;
  else{
    h+=`<p class="sum">${right} of ${n} right${all?" – brilliant!":filled<n?` · ${n-filled} still empty`:""}</p><p>${all?"Every word is right.":"Red words are not right yet. Go back to <b>Fill in</b> and try again."}</p>`;
    h+=`<div class="tw"><table><tbody>${L.map((g,i)=>{const v=(A[i]||"").trim(),st=!v?"empty":C[i];
      return `<tr><td class="st" style="color:${st==="ok"?"var(--ok)":st==="no"?"var(--bad)":"var(--muted)"}">${st==="ok"?"✓":st==="no"?"✗":"–"}</td><td><span class="ans ${st}">${v?esc(v):"empty"}</span></td><td class="ctx">${esc(g.ctx)}</td></tr>`}).join("")}</tbody></table></div>`;
  }
  if(REVIEW)h+=reviewExtras();
  document.getElementById("key").innerHTML=h;
  if(all){const first=!isDone(CUR);mark(CUR,"d");if(!REVIEW)setTimeout(()=>showDone(first),400)}
}
function reviewExtras(){
  const seen=new Map();PAGES.flat().forEach(p=>[...p.n,...p.l.map(x=>x[2])].forEach(t=>parse(t).forEach(s=>{if(s.v&&!seen.has(s.v.toLowerCase()))seen.set(s.v.toLowerCase(),s)})));
  const hard=Object.values(HARD).sort((a,b)=>b.n-a.n);
  return `<h3>Hard words (all chapters)</h3>`+(hard.length?`<p>Words that were red at least once. German → type the English word.</p><div class="tw"><table class="prac"><tbody>${hard.map(x=>`<tr><td>${esc(x.de)}</td><td><input data-a="${esc(x.w)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></td><td><button class="say" data-t="${esc(x.w)}" aria-label="Listen">${spk}</button></td><td class="ctx">${x.n}× red</td></tr>`).join("")}</tbody></table></div><p><button class="btn ghost" id="hardclear">Clear hard words</button></p>`:`<p>None yet.</p>`)
  +`<h3>Word list ${esc(CH[CUR].label)}</h3><div class="tw"><table><tbody>${[...seen.values()].sort((a,b)=>order[a.l]-order[b.l]).map(s=>`<tr><td><span class="lvl" style="background:${col[s.l]}"></span></td><td class="en">${esc(s.v)}</td><td>${esc(s.de)}</td><td><button class="say" data-t="${esc(s.v)}" aria-label="Listen">${spk}</button></td></tr>`).join("")}</tbody></table></div>`
  +`<p><button class="btn ghost" id="rvreset">Reset Emmi's progress</button></p>`;
}
const key=document.getElementById("key");
key.addEventListener("click",e=>{const b=e.target.closest(".say");if(b){say(b.dataset.t);return}
  if(e.target.id==="hardclear"){HARD={};save("emmi-hard",HARD);buildKey()}
  if(e.target.id==="rvreset"&&confirm("Reset all progress and answers on this iPad?")){PROG={};MINE.a={};MINE.c={};MINE.w={};save("emmi-prog",PROG);save("emmi-ans",MINE);fillSelect()}});
key.addEventListener("keydown",e=>{const inp=e.target.closest(".prac input");if(inp&&e.key==="Enter"){inp.className=norm(inp.value)===norm(inp.dataset.a)?"ok":"no";if(inp.className==="no")say(inp.dataset.a)}});
key.addEventListener("change",e=>{const inp=e.target.closest(".prac input");if(inp&&inp.value.trim())inp.className=norm(inp.value)===norm(inp.dataset.a)?"ok":"no"});

function showDone(first){
  const next=CUR+1<CH.length?CUR+1:-1;
  const d=document.getElementById("done");
  d.querySelector("h2").textContent=next>=0?"Chapter done!":"Teil 0 done!";
  d.querySelector("p").textContent=next>=0?(first?`You put back every word. ${CH[next].label} is open now.`:`Every word is right. On to ${CH[next].label}?`):"You finished all ten chapters. Greystone is Greengarden now.";
  d.querySelector("#goNext").hidden=next<0;d.showModal();
}
document.getElementById("goNext").onclick=()=>{document.getElementById("done").close();setChapter(CUR+1);setMode("read");window.scrollTo(0,0)};
document.getElementById("stay").onclick=()=>document.getElementById("done").close();

/* chapters */
const chsel=document.getElementById("chsel");
function fillSelect(){chsel.innerHTML=CH.map((c,i)=>`<option value="${i}" ${isOpen(i)?"":"disabled"}>${isDone(i)?"✓ ":isOpen(i)?"":"🔒 "}${esc(c.label)}</option>`).join("");chsel.value=CUR}
function setChapter(i){if(!isOpen(i))return;CUR=i;PAGES=CH[i].pages;HAVE=new Set(PAGES.flat().filter(p=>p.img).map(p=>p.id));fillSelect();
  if(!REVIEW)try{localStorage.setItem("emmi-ch",i)}catch(e){}}
chsel.onchange=()=>{setChapter(+chsel.value);setMode(mode==="key"?"key":"read");window.scrollTo(0,0)};
let startCh=0;try{const v=localStorage.getItem("emmi-ch");if(v!==null&&CH[+v])startCh=+v}catch(e){}
if(!isOpen(startCh))startCh=0;
setChapter(startCh);

/* hidden review switch: 5 quick taps on the empty space next to the chapter menu, while on Answers */
let taps=[];
document.getElementById("tapzone").addEventListener("click",()=>{if(mode!=="key"){taps=[];return}const t=Date.now();taps=taps.filter(x=>t-x<2000);taps.push(t);
  if(taps.length>=5){taps=[];REVIEW=!REVIEW;RV={a:{},c:{},w:{}};document.body.classList.toggle("review",REVIEW);document.getElementById("reviewnote").hidden=!REVIEW;
    if(!isOpen(CUR)){let k=0;while(k+1<CH.length&&isOpen(k+1))k++;CUR=k}setChapter(CUR);setMode(mode)}});

/* music controls */
const mbtn=document.getElementById("mbtn"),mvolEl=document.getElementById("mvol");
mvolEl.value=mvol;mbtn.setAttribute("aria-pressed",musicOn);
mbtn.onclick=()=>{musicOn=!musicOn;mbtn.setAttribute("aria-pressed",musicOn);if(musicOn)mstart();else MU.pause();msave()};
mvolEl.oninput=()=>{mvol=+mvolEl.value;mset();if(musicOn&&MU.paused)mstart();msave()};

/* tabs */
function setMode(m){mode=m;document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  document.getElementById("readbar").hidden=m!=="read";document.getElementById("gapbar").hidden=m!=="gaps";
  book.hidden=m==="key";key.hidden=m!=="key";
  if(m==="key")buildKey();else render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.mode==="gaps")mark(CUR,"r");setMode(b.dataset.mode)});
setMode("read");
</script>
